<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const labels={
right_hip_bone:"右寛骨",right_femur:"右大腿骨",right_obturator_internus:"内閉鎖筋",

const host=document.getElementById('view'), scene=new THREE.Scene(); scene.background=new THREE.Color(0xf6f3ed);
const camera=new THREE.PerspectiveCamera(38,1,.1,2000); camera.position.set(260,-330,180);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
controls.enablePan=false;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;

const lockBtn=document.getElementById('lock'), rotateBtn=document.getElementById('rotate');
let positionLocked=true, rotationEnabled=true;
function syncModes(){
 controls.enablePan=!positionLocked;
 controls.enableRotate=rotationEnabled;
 controls.touches.ONE=positionLocked?THREE.TOUCH.ROTATE:THREE.TOUCH.PAN;
 controls.mouseButtons.LEFT=positionLocked?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN;

 lockBtn.classList.toggle('active',positionLocked);
 lockBtn.setAttribute('aria-pressed',String(positionLocked));
 lockBtn.textContent=positionLocked?'🔒 固定中':'🔓 固定解除';
 rotateBtn.classList.toggle('active',rotationEnabled);
 rotateBtn.setAttribute('aria-pressed',String(rotationEnabled));
 rotateBtn.textContent=rotationEnabled?'↻ 回転中':'↻ 回転OFF';
}
lockBtn.onclick=()=>{
 positionLocked=!positionLocked;
 controls.enabled=false;
 syncModes();
 requestAnimationFrame(()=>{controls.enabled=true});
};
rotateBtn.onclick=()=>{rotationEnabled=!rotationEnabled;syncModes()};
const moveStep=()=>{
 const d=camera.position.distanceTo(controls.target);
 return Math.max(d*.0183,.12);
};
function moveVertical(dir){
 const amount=moveStep()*dir;
 const up=new THREE.Vector3(0,1,0).multiplyScalar(amount);
 controls.target.add(up);
 camera.position.add(up);
 controls.update();
}
function bindVertical(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveVertical(dir);timer=setInterval(()=>moveVertical(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindVertical('moveUp',-1); bindVertical('moveDown',1);
function moveHorizontal(dir){
 const amount=moveStep()*dir;
 const right=new THREE.Vector3();
 camera.getWorldDirection(right);
 right.cross(camera.up).normalize().multiplyScalar(amount);
 controls.target.add(right);
 camera.position.add(right);
 controls.update();
}
function bindHorizontal(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveHorizontal(dir);timer=setInterval(()=>moveHorizontal(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindHorizontal('moveLeft',1); bindHorizontal('moveRight',-1);
const pad=document.querySelector('.verticalbar'), padHandle=document.getElementById('padHandle');
let padDrag=null;
padHandle.addEventListener('pointerdown',e=>{
 e.preventDefault(); e.stopPropagation();
 const r=pad.getBoundingClientRect();
 padDrag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};
 padHandle.setPointerCapture?.(e.pointerId);
});
padHandle.addEventListener('pointermove',e=>{
 if(!padDrag||e.pointerId!==padDrag.id)return;

 const left=Math.min(Math.max(margin,e.clientX-padDrag.dx),window.innerWidth-r.width-margin);

});
const endPadDrag=e=>{if(padDrag&&e.pointerId===padDrag.id)padDrag=null};

function visibleBounds(){
 const box=new THREE.Box3(), tmp=new THREE.Box3();
 scene.updateMatrixWorld(true);
 scene.traverse(o=>{
  if(!o.isMesh||!o.visible)return;
  let p=o.parent,shown=true;
  while(p&&p!==scene){if(!p.visible){shown=false;break}p=p.parent}
  if(!shown)return;
  if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
  tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); box.union(tmp);
 });

}
function fit(){
 const box=visibleBounds(); if(box.isEmpty())return;

 const dist=Math.max(distH,distW,size.z*.8)*1.18;
 controls.target.copy(c);
 camera.up.set(0,1,0);
 // Converted BP3D is Y-up. Look straight at the body along +Z.

 camera.updateProjectionMatrix();controls.update();
}
function materialize(o,isBone){

   x.material=new THREE.MeshStandardMaterial({color:isBone?0xd8d2c7:0xb76555,roughness:.72,metalness:0,transparent:isBone,opacity:isBone?boneOpacity:1,side:THREE.DoubleSide});
   if(!isBone){
     const edges=new THREE.LineSegments(
       new THREE.EdgesGeometry(x.geometry,28),
       new THREE.LineBasicMaterial({color:0x5f2f29,transparent:true,opacity:.72})
     );
     edges.name='muscle_outline_test';
     edges.renderOrder=3;
     x.add(edges);
   }
 }})
}

function transformBP3D(root,center,scale){

 root.traverse(o=>{
  if(!o.isMesh)return;
  const g=o.geometry.clone();
  // Bake any GLTF node transform before converting BP3D axes.
  g.applyMatrix4(o.matrixWorld);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){

   p.setXYZ(i,(x-center.x)*scale,(z-center.z)*scale,-(y-center.y)*scale);

  g.deleteAttribute('normal'); g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere();

 });

}

 function normName(raw){return raw.toLowerCase().replace(/[ -]+/g,'_')}
 function japaneseName(raw){
  const n=normName(raw);
  for(const [en,jp] of jpTerms)if(n.includes(en))return jp;
  return raw.replace(/_/g,' ');
 }
 function sideName(raw){const n=normName(raw);if(/(^|_)left(_|$)/.test(n))return '左｜';if(/(^|_)right(_|$)/.test(n))return '右｜';return ''}
 function structureType(raw){
  const n=normName(raw);
  if(/cartilage/.test(n))return '軟骨';
  if(/ligament/.test(n))return '靱帯';
  if(/fascia|iliotibial_tract/.test(n))return '筋膜・腱膜';
  if(/retinaculum/.test(n))return '支帯';
  if(/tendon|tendinous/.test(n))return '腱';
  if(/interosseous_membrane/.test(n))return '骨間膜';
  return '筋';
 }
 const deepRe=/piriformis|obturator|gemellus|quadratus_femoris|gluteus_minimus|supraspinatus|infraspinatus|subscapularis|teres_minor|rhomboid|multifidus|intercost|psoas|iliacus|popliteus|interosse|lumbrical|pronator_quadratus/i;
 const middleRe=/gluteus_medius|erector_spinae|serratus|brachialis|soleus|vastus_intermedius/i;
 const groups=new Map(regionDefs.map(([n])=>[n,[]]));groups.set('その他',[]);
 function regionFor(name){for(const [label,re] of regionDefs)if(re.test(name))return label;return 'その他'}
 function layerFor(name){return deepRe.test(name)?'深層':middleRe.test(name)?'中間層':'表層'}
 fullAnatomy.traverse(o=>{
  if(!o.isMesh)return;
  muscleMeshes.push(o);
  const raw=o.name||'名称未設定',region=regionFor(raw),layer=layerFor(raw),type=structureType(raw);
  const d=document.createElement('label');d.className='item muscleHidden';d.dataset.region=region;d.dataset.layer=layer;
  const s=document.createElement('span');s.textContent=sideName(raw)+japaneseName(raw)+(type==='筋'?'':'［'+type+'］');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.addEventListener('change',()=>{o.visible=cb.checked});
  d.append(s,cb);muscleItems.appendChild(d);groups.get(region).push({el:d,mesh:o,layer,type});
 });
 let activeRegion=null;
 function showRegion(region){
  activeRegion=activeRegion===region?null:region; muscleItems.innerHTML='';
  muscleRegions.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.region===activeRegion));
  if(!activeRegion)return;
  const entries=groups.get(activeRegion)||[];
  ['表層','中間層','深層'].forEach(layer=>{
   const layerEntries=entries.filter(x=>x.layer===layer);if(!layerEntries.length)return;
   const head=document.createElement('label');head.className='item muscleGroupTitle';
   const title=document.createElement('span');title.textContent=layer+'（'+layerEntries.length+'）';
   const master=document.createElement('input');master.type='checkbox';master.checked=layerEntries.every(x=>x.mesh.visible);
   master.onchange=()=>{layerEntries.forEach(x=>{x.mesh.visible=master.checked;x.el.querySelector('input').checked=master.checked})};
   head.append(title,master);muscleItems.appendChild(head);
   layerEntries.forEach(x=>{x.el.classList.remove('muscleHidden');muscleItems.appendChild(x.el)});
  });
 }
 groups.forEach((items,label)=>{if(!items.length)return;const btn=document.createElement('button');btn.className='regionBtn';btn.dataset.region=label;btn.textContent=label+'（'+items.length+'）';btn.onclick=()=>showRegion(label);muscleRegions.appendChild(btn)});
 document.getElementById('musclesOn').onclick=()=>{muscleMeshes.forEach(o=>o.visible=true);groups.forEach(es=>es.forEach(x=>x.el.querySelector('input').checked=true));if(activeRegion){const r=activeRegion;activeRegion=null;showRegion(r)}};
 document.getElementById('musclesOff').onclick=()=>{muscleMeshes.forEach(o=>o.visible=false);groups.forEach(es=>es.forEach(x=>x.el.querySelector('input').checked=false));if(activeRegion){const r=activeRegion;activeRegion=null;showRegion(r)}};

 btn.onclick=()=>{
   const show=!fullAnatomy.visible;

   Object.values(objects).forEach(o=>o.visible=!show);

 });
 const list=document.getElementById('items');
 Object.entries(labels).forEach(([k,v])=>{
   if(!objects[k])return;

   d.querySelector('input').onchange=e=>objects[k].visible=e.target.checked; list.appendChild(d);
 });

 boneOpacity=+e.target.value;

 fullSkeleton?.traverse(x=>{if(x.isMesh){x.material.transparent=true;x.material.opacity=boneOpacity;x.material.needsUpdate=true}});
};
