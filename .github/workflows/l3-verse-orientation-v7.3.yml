name: L3 VerSe v7.3 original CT RAS orientation review (research only)

on:
  push:
    branches: [l3-reference-method-evaluation-v1]
    paths:
      - 'experiments/tools/build-verse-l3-orientation-review-v7.3.py'
      - 'experiments/l3-verse-orientation-coordinates-v7.3.js'
      - 'experiments/l3-verse-orientation-review-v7.3.html'
      - 'experiments/tests/test-verse-l3-orientation-v7.3.py'
      - 'experiments/tests/l3-verse-orientation-coordinate-v7.3.test.cjs'
      - '.github/workflows/l3-verse-orientation-v7.3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-and-ui-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry and image libraries
        run: python -m pip install --disable-pip-version-check numpy scipy nibabel pillow
      - name: Test screen RAS math and controls using no medical imagery
        run: |
          set -euo pipefail
          python -m py_compile experiments/tools/build-verse-l3-orientation-review-v7.3.py
          python experiments/tests/test-verse-l3-orientation-v7.3.py -v
          node experiments/tests/l3-verse-orientation-coordinate-v7.3.test.cjs

  transient-actual-ct:
    needs: synthetic-and-ui-sources
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: verse005
            ct_sha: bbf7e9ee9576d8b85784112e15f5df3a0877d7a574e733497c2ac7fd143c7cfa
            seg_sha: d56af4e19b21f1335b156e66ef3f7d487be11fb3e2b545496f0675050a30f2b5
          - case_id: verse008
            ct_sha: 107b238f3e3fc85eec71c687cc56df825c4cde81d22b4b905a6f497193b44b31
            seg_sha: 00cb18b24858f9984c98a0379e4e0e9e063b26848ac9ce96c7fa637856fcc8f3
    env:
      CASE_ID: ${{ matrix.case_id }}
      EXPECTED_CT_SHA: ${{ matrix.ct_sha }}
      EXPECTED_SEG_SHA: ${{ matrix.seg_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source readers
        run: python -m pip install --disable-pip-version-check numpy scipy nibabel pillow
      - name: Acquire and authenticate source reference pair in runner temp only
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/datasets/MedOtter/VERSE20/resolve/main/VERSE20/01_training/$CASE_ID"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$BASE/${CASE_ID}.nii.gz" --output "$RUNNER_TEMP/l3_ct.nii.gz"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$BASE/${CASE_ID}_seg.nii.gz" --output "$RUNNER_TEMP/l3_seg.nii.gz"
          echo "$EXPECTED_CT_SHA  $RUNNER_TEMP/l3_ct.nii.gz" | sha256sum -c -
          echo "$EXPECTED_SEG_SHA  $RUNNER_TEMP/l3_seg.nii.gz" | sha256sum -c -
      - name: Generate local-only original CT RAS panes and print metadata only
        run: |
          python experiments/tools/build-verse-l3-orientation-review-v7.3.py \
            --ct "$RUNNER_TEMP/l3_ct.nii.gz" \
            --seg "$RUNNER_TEMP/l3_seg.nii.gz" \
            --case-id "$CASE_ID" \
            --out "$RUNNER_TEMP/PRIVATE_CT_REVIEW.json" \
            --pixels 201 --pitch 0.65
      - name: Erase source CT, mask and output JSON; never upload preview images
        if: always()
        run: rm -f "$RUNNER_TEMP/l3_ct.nii.gz" "$RUNNER_TEMP/l3_seg.nii.gz" "$RUNNER_TEMP/PRIVATE_CT_REVIEW.json"
