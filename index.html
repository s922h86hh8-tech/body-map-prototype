<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>身体の地図｜3D Prototype 0.3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}
*{box-sizing:border-box} body{margin:0;background:#f6f3ed}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd}
header b{font-size:18px}.sub{font-size:12px;color:#666;margin-top:3px}
main{display:grid;grid-template-columns:1fr 310px;height:calc(100vh - 66px)}
#view{min-width:0;position:relative}.hint{position:absolute;left:12px;bottom:70px;background:#ffffffd9;padding:7px 10px;border-radius:10px;font-size:12px}.modebar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:7px;background:#ffffffeb;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002}.modebar button{min-width:92px}.modebar button.active{background:#222;color:#fff;border-color:#222}.verticalbar{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:31;display:flex;flex-direction:column;gap:6px;padding:7px;background:#ffffffeb;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002}.verticalbar button{width:48px;height:48px;padding:0;font-size:22px;touch-action:none}
aside{background:#fff;padding:14px;overflow:auto;border-left:1px solid #ddd}
h2{font-size:15px;margin:4px 0 10px}.row{display:flex;gap:8px;margin-bottom:10px}
button{border:1px solid #bbb;background:#fff;border-radius:10px;padding:9px 10px;font-size:13px}
button.primary{background:#222;color:#fff}.item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}
input[type=range]{width:100%}
@media(max-width:760px){main{grid-template-columns:1fr;height:calc(100dvh - 66px)}#view{overflow:hidden}aside{position:fixed;left:8px;right:8px;top:auto;bottom:92px;width:auto;max-height:min(36dvh,320px);padding:12px;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002;z-index:20;overflow-y:auto;overscroll-behavior:contain}.scrollcue{display:block}.row{flex-wrap:wrap}button{padding:7px 8px}}
</style>
</head>
<body>
<header><b>施術者のための身体の地図</b><div class="sub">右股関節・深層外旋筋群｜3D Prototype 0.3</div></header>
<main><div id="view"><div class="hint">ドラッグ：回転　ピンチ/ホイール：拡大縮小</div></div>
<aside>
<h2>表示を重ねる・外す</h2>
<div class="row"><button id="bones">骨だけ</button><button id="all" class="primary">すべて</button></div>
<div id="items"></div>
<h2>骨の透明度</h2><input id="opacity" type="range" min="0" max="1" step=".05" value=".28">
<div class="row" style="margin-top:12px"><button id="reset">視点を戻す</button></div>
</aside></main><div class="verticalbar" aria-label="上下位置"><button id="moveUp" aria-label="上へ移動">↑</button><button id="moveDown" aria-label="下へ移動">↓</button></div><div class="modebar" aria-label="3D操作"><button id="lock" class="active" aria-pressed="true">🔒 固定中</button><button id="rotate" class="active" aria-pressed="true">↻ 回転中</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const labels={
right_hip_bone:"右寛骨",right_femur:"右大腿骨",right_obturator_internus:"内閉鎖筋",
right_superior_gemellus:"上双子筋",right_inferior_gemellus:"下双子筋",right_piriformis:"梨状筋",
right_quadratus_femoris:"大腿方形筋",right_obturator_externus:"外閉鎖筋"};
const boneNames=new Set(["right_hip_bone","right_femur"]);
const host=document.getElementById('view'), scene=new THREE.Scene(); scene.background=new THREE.Color(0xf6f3ed);
const camera=new THREE.PerspectiveCamera(38,1,.1,2000); camera.position.set(260,-330,180);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
controls.enablePan=false;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
renderer.domElement.style.touchAction='none';
const lockBtn=document.getElementById('lock'), rotateBtn=document.getElementById('rotate');
let positionLocked=true, rotationEnabled=true;
function syncModes(){
 controls.enablePan=!positionLocked;
 controls.enableRotate=rotationEnabled;
 controls.touches.ONE=positionLocked?THREE.TOUCH.ROTATE:THREE.TOUCH.PAN;
 controls.mouseButtons.LEFT=positionLocked?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN;
 controls.screenSpacePanning=true;
 lockBtn.classList.toggle('active',positionLocked);
 lockBtn.setAttribute('aria-pressed',String(positionLocked));
 lockBtn.textContent=positionLocked?'🔒 固定中':'🔓 固定解除';
 rotateBtn.classList.toggle('active',rotationEnabled);
 rotateBtn.setAttribute('aria-pressed',String(rotationEnabled));
 rotateBtn.textContent=rotationEnabled?'↻ 回転中':'↻ 回転OFF';
}
lockBtn.onclick=()=>{
 positionLocked=!positionLocked;
 controls.enabled=false;
 syncModes();
 requestAnimationFrame(()=>{controls.enabled=true});
};
rotateBtn.onclick=()=>{rotationEnabled=!rotationEnabled;syncModes()};
const moveStep=()=>{
 const d=camera.position.distanceTo(controls.target);
 return Math.max(d*.055,.35);
};
function moveVertical(dir){
 const amount=moveStep()*dir;
 const up=new THREE.Vector3(0,1,0).multiplyScalar(amount);
 controls.target.add(up);
 camera.position.add(up);
 controls.update();
}
function bindVertical(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveVertical(dir);timer=setInterval(()=>moveVertical(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindVertical('moveUp',1); bindVertical('moveDown',-1);
syncModes();
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));
const dl=new THREE.DirectionalLight(0xffffff,2.0); dl.position.set(2,-3,4); scene.add(dl);
let objects={}, boneOpacity=.28;

function fit(){
 const box=new THREE.Box3().setFromObject(scene), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3()).length();
 controls.target.copy(c); camera.position.copy(c).add(new THREE.Vector3(s*.75,-s*.95,s*.55)); camera.near=s/1000; camera.far=s*10; camera.updateProjectionMatrix(); controls.update();
}
function materialize(o,isBone){
 o.traverse(x=>{if(x.isMesh){
   x.material=new THREE.MeshStandardMaterial({color:isBone?0xd8d2c7:0xb76555,roughness:.72,metalness:0,transparent:isBone,opacity:isBone?boneOpacity:1,side:THREE.DoubleSide});
   if(!isBone){
     const edges=new THREE.LineSegments(
       new THREE.EdgesGeometry(x.geometry,28),
       new THREE.LineBasicMaterial({color:0x5f2f29,transparent:true,opacity:.72})
     );
     edges.name='muscle_outline_test';
     edges.renderOrder=3;
     x.add(edges);
   }
 }})
}
// Anatomy asset source can be switched here after license/asset validation.
const MODEL_URL='./body_map_prototype02_web_v0.1.glb';
const FULL_SKELETON_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/skeleton.glb';
const FULL_ANATOMY_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb';
const loader=new GLTFLoader();

// Preflight only: verify the full skeleton can be fetched/decoded without replacing the current model.
let fullSkeleton=null;
loader.load(FULL_SKELETON_URL,g=>{
 fullSkeleton=g.scene;
 fullSkeleton.visible=false;
 scene.add(fullSkeleton);
 console.info('[BodyMap] full skeleton preflight OK',fullSkeleton);
 const btn=document.createElement('button');
 btn.id='fullSkeletonTest';
 btn.textContent='全身骨格テスト';
 btn.title='全身骨格の読み込み確認用';
 document.querySelector('aside')?.appendChild(btn);
 btn.onclick=()=>{
   const show=!fullSkeleton.visible;
   fullSkeleton.visible=show;
   Object.values(objects).forEach(o=>o.visible=!show);
   btn.textContent=show?'元のモデルに戻す':'全身骨格テスト';
   if(show) fit();
 };
},undefined,e=>{
 console.warn('[BodyMap] full skeleton preflight failed',e);
});

let fullAnatomy=null;
loader.load(FULL_ANATOMY_URL,g=>{
 fullAnatomy=g.scene;
 fullAnatomy.visible=false;
 scene.add(fullAnatomy);
 const wanted=['right_gluteus_maximus','right_gluteus_medius','right_gluteus_minimus','right_piriformis','right_obturator_internus','right_obturator_externus','right_gemellus_superior','right_gemellus_inferior','right_quadratus_femoris','right_tensor_fasciae_latae','right_rectus_femoris','right_vastus_lateralis','right_vastus_medialis','right_vastus_intermedius','right_sartorius','right_adductor_longus','right_adductor_brevis','right_adductor_magnus','right_semitendinosus','right_semimembranosus','long_head_of_right_biceps_femoris','short_head_of_right_biceps_femoris'];
 let kept=0;
 fullAnatomy.traverse(o=>{
   if(!o.isMesh)return;
   const n=(o.name||'').toLowerCase();
   const keep=wanted.some(w=>n.includes(w));
   o.visible=keep;
   if(keep)kept++;
 });
 console.info('[BodyMap] right hip/thigh muscle test ready',kept);
 const btn=document.createElement('button');
 btn.id='hipMuscleTest';
 btn.textContent='右股関節・大腿筋テスト';
 btn.title='右股関節から大腿の筋群をまとめて確認';
 document.querySelector('aside')?.appendChild(btn);
 btn.onclick=()=>{
   const show=!fullAnatomy.visible;
   fullAnatomy.visible=show;
   if(fullSkeleton) fullSkeleton.visible=show;
   Object.values(objects).forEach(o=>o.visible=!show);
   btn.textContent=show?'元のモデルに戻す':'右股関節・大腿筋テスト';
   if(show) fit();
 };
},undefined,e=>console.warn('[BodyMap] anatomy test load failed',e));

loader.load(MODEL_URL,g=>{
 scene.add(g.scene);
 g.scene.traverse(o=>{
   let key=Object.keys(labels).find(k=>o.name.includes(k));
   if(!key) return; objects[key]=o; materialize(o,boneNames.has(key));
 });
 const list=document.getElementById('items');
 Object.entries(labels).forEach(([k,v])=>{
   if(!objects[k])return;
   const d=document.createElement('label'); d.className='item'; d.innerHTML=`<span>${v}</span><input type="checkbox" checked>`;
   d.querySelector('input').onchange=e=>objects[k].visible=e.target.checked; list.appendChild(d);
 });
 fit();
});
document.getElementById('bones').onclick=()=>Object.entries(objects).forEach(([k,o])=>o.visible=boneNames.has(k));
document.getElementById('all').onclick=()=>Object.values(objects).forEach(o=>o.visible=true);
document.getElementById('opacity').oninput=e=>{boneOpacity=+e.target.value; boneNames.forEach(k=>objects[k]?.traverse(x=>{if(x.isMesh)x.material.opacity=boneOpacity}))};
document.getElementById('reset').onclick=fit;
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const panel=document.querySelector('aside');
  const view=document.getElementById('view');

  if(panel){
    const btn=document.createElement('button');
    btn.textContent='表示パネルを閉じる';
    btn.style.position='fixed';
    btn.style.right='10px';
    btn.style.maxWidth='calc(100vw - 20px)';
    btn.style.zIndex='9999';

    const placePanelButton=()=>{
      if(panel.style.display==='none'){
        btn.style.top='auto';
        btn.style.bottom='92px';
      }else{
        const r=panel.getBoundingClientRect();
        btn.style.top='auto';
        btn.style.bottom=Math.max(92,window.innerHeight-r.top+8)+'px';
      }
    };

    btn.onclick=()=>{
      const hidden=panel.style.display==='none';
      panel.style.display=hidden?'block':'none';
      btn.textContent=hidden?'表示パネルを閉じる':'表示パネルを開く';
      requestAnimationFrame(placePanelButton);
    };

    document.body.appendChild(btn);
    placePanelButton();
    addEventListener('resize',placePanelButton);
  }

  if(view){
    view.style.touchAction='none';
  }
});
</script>
</body></html>
