name: L3 v5.0 reduced-spinous candidate vs v3.5 four-case CT (NOT clinical)
on:
  push:
    branches: [cleanroom-pelvis-v0.1]
    paths: ['.github/workflows/l3-v50-shorter-spinous-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-v50-v35:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_index: 20
            sha256: 9a40214e92c50804af98263efc5fdb3ef66ef9871eb7ad6509218c0b1adcf7a5
          - case_index: 48
            sha256: bd18fe33b3dc94c0c2cd8bbe7ac0ef83797c8a150e733ba4b6c2f7a700424971
          - case_index: 83
            sha256: 1828b70ab75c212d7787d9a945661ccd2743ec39de2a0eeab8eb641b6f9b7d16
          - case_index: 102
            sha256: ff1d466ecd98d5ca7998c6b849beb0050aa8fc9df5bec63afa8df4dc4aaef827
    env:
      CASE_INDEX: ${{ matrix.case_index }}
      EXPECTED_SHA: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy scipy scikit-image nibabel trimesh requests remotezip
      - name: Export baseline, v3.5 and reduced-spinous v5.0
        run: |
          node experiments/tools/export-l3-model.cjs "$RUNNER_TEMP/v24.obj" high
          node experiments/tools/export-l3-model-v3.5-research.cjs "$RUNNER_TEMP/v35.obj" high
          node experiments/tools/export-l3-model-v5.0-research.cjs "$RUNNER_TEMP/v50.obj" high
      - name: Load only checked public L3 mask by ranged ZIP
        run: |
          python - <<'PY'
          import os,re,hashlib,requests
          from remotezip import RemoteZip
          d=requests.get('https://zenodo.org/api/records/7181338',timeout=35).json()
          f=next(x for x in d['files'] if x['key']=='L1-L5FineSegMix-663case.zip')
          if f['checksum']!='md5:baf6374a927e9591dbae3314570bdb1e':raise ValueError('Archive checksum changed')
          with RemoteZip(f['links'].get('self') or f['links'].get('content')) as z:
              files=sorted((x for x in z.infolist() if re.search(r'_L3_seg[.]nii[.]gz$',x.filename,re.I)
                            and not x.filename.startswith('__MACOSX/')),
                           key=lambda f:(f.file_size,f.filename))
              if len(files)!=108:raise ValueError('L3 inventory changed')
              raw=z.read(files[int(os.environ['CASE_INDEX'])])
          if hashlib.sha256(raw).hexdigest()!=os.environ['EXPECTED_SHA']:raise ValueError('Unexpected mask hash')
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mask.nii.gz'),'wb') as file:file.write(raw)
          print('REFERENCE_VERIFIED case_index='+os.environ['CASE_INDEX'])
          PY
      - name: Compare v2.4 baseline, v3.5, v5.0 under ONE fixed pose
        run: |
          python experiments/tools/compare-l3-v50-v35.py \
            --mask "$RUNNER_TEMP/mask.nii.gz" \
            --v24 "$RUNNER_TEMP/v24.obj" --v35 "$RUNNER_TEMP/v35.obj" \
            --v50 "$RUNNER_TEMP/v50.obj" --samples 5000 \
            --out "$RUNNER_TEMP/private-compare.json"
      - name: Print aggregate diagnostics only; never auto accept model
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'private-compare.json').read_text())
          print('L3_V50_EXPERIMENT '+json.dumps({
            'case_index':int(os.environ['CASE_INDEX']),
            'pose_selected':d['pose']['selected_small_rotation_start'],
            'pose_angle_degrees':d['pose']['selected_rotation_deg'],
            'flip_control_near':d['pose']['flipped_pose_within_5pct_of_selected'],
            'distances_p95':{k:{a:v[a]['p95_mm'] for a in
               ('ct_to_model','model_to_ct','bidirectional')}
               for k,v in d['surface_distances_mm'].items()},
            'delta_v50_vs_v35':d['delta_p95_relative_to_v35_mm']['v50'],
            'expert_anatomy_review':False,'anatomy_approved':False},ensure_ascii=False))
          PY
      - name: Delete reference and locally generated mesh files
        if: always()
        run: rm -f "$RUNNER_TEMP/mask.nii.gz" "$RUNNER_TEMP/v24.obj" "$RUNNER_TEMP/v35.obj" "$RUNNER_TEMP/v50.obj" "$RUNNER_TEMP/private-compare.json"
