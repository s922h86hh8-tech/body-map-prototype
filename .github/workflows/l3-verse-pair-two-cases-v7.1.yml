name: L3 VerSe two CT-mask source pairs v7.1 (research only)

on:
  push:
    branches: [l3-reference-method-evaluation-v1]
    paths:
      - 'experiments/tools/audit-verse-l3-pair-v7.py'
      - '.github/workflows/l3-verse-pair-two-cases-v7.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-independent-reference-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: verse005
            expected_ct_sha: bbf7e9ee9576d8b85784112e15f5df3a0877d7a574e733497c2ac7fd143c7cfa
            expected_seg_sha: d56af4e19b21f1335b156e66ef3f7d487be11fb3e2b545496f0675050a30f2b5
          - case_id: verse008
            expected_ct_sha: 107b238f3e3fc85eec71c687cc56df825c4cde81d22b4b905a6f497193b44b31
            expected_seg_sha: 00cb18b24858f9984c98a0379e4e0e9e063b26848ac9ce96c7fa637856fcc8f3
    env:
      CASE_ID: ${{ matrix.case_id }}
      EXPECTED_CT_SHA: ${{ matrix.expected_ct_sha }}
      EXPECTED_SEG_SHA: ${{ matrix.expected_seg_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local NIfTI readers
        run: python -m pip install --disable-pip-version-check numpy scipy nibabel
      - name: Validate both mirrored source files with published LFS SHA256 identities
        run: |
          set -euo pipefail
          SOURCE="https://huggingface.co/datasets/MedOtter/VERSE20/resolve/main/VERSE20/01_training/$CASE_ID"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$SOURCE/${CASE_ID}.nii.gz" --output "$RUNNER_TEMP/source_ct.nii.gz"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$SOURCE/${CASE_ID}_seg.nii.gz" --output "$RUNNER_TEMP/source_seg.nii.gz"
          echo "$EXPECTED_CT_SHA  $RUNNER_TEMP/source_ct.nii.gz" | sha256sum -c -
          echo "$EXPECTED_SEG_SHA  $RUNNER_TEMP/source_seg.nii.gz" | sha256sum -c -
      - name: Evaluate label22 continuity and six original-image crop faces
        run: |
          python experiments/tools/audit-verse-l3-pair-v7.py \
            --ct "$RUNNER_TEMP/source_ct.nii.gz" \
            --seg "$RUNNER_TEMP/source_seg.nii.gz" \
            --case-id "$CASE_ID" \
            --out "$RUNNER_TEMP/source_only_private.json"
      - name: Remove original medical volumes and local result
        if: always()
        run: rm -f "$RUNNER_TEMP/source_ct.nii.gz" "$RUNNER_TEMP/source_seg.nii.gz" "$RUNNER_TEMP/source_only_private.json"
