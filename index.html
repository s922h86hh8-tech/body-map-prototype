<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>身体の地図｜3D Prototype 0.3</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#222}
*{box-sizing:border-box} body{margin:0;background:#f6f3ed}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd}
header b{font-size:18px}.sub{font-size:12px;color:#666;margin-top:3px}
main{display:grid;grid-template-columns:1fr 310px;height:calc(100vh - 66px)}
#view{min-width:0;position:relative}.hint{position:absolute;left:12px;bottom:70px;background:#ffffffd9;padding:7px 10px;border-radius:10px;font-size:12px}.modebar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:8px;padding:7px;background:#ffffffeb;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002}.modebar button{min-width:92px}.modebar button.active{background:#222;color:#fff;border-color:#222}.verticalbar{position:fixed;right:12px;top:42%;transform:translateY(-50%);z-index:31;display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:3px;padding:6px;background:#ffffffeb;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002}.verticalbar button{width:44px;height:44px;padding:0;font-size:21px;touch-action:none}.verticalbar #moveUp{grid-column:2;grid-row:1}.verticalbar #moveLeft{grid-column:1;grid-row:2}.verticalbar #moveRight{grid-column:3;grid-row:2}.verticalbar #padHandle{grid-column:2;grid-row:2;cursor:grab;font-size:17px;color:#666}.verticalbar #padHandle:active{cursor:grabbing}.verticalbar #moveDown{grid-column:2;grid-row:3}
aside{background:#fff;padding:14px;overflow:auto;border-left:1px solid #ddd;transition:transform .24s ease}
h2{font-size:15px;margin:4px 0 10px}.row{display:flex;gap:8px;margin-bottom:10px}
button{border:1px solid #bbb;background:#fff;border-radius:10px;padding:9px 10px;font-size:13px}
button.primary{background:#222;color:#fff}.item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}
input[type=range]{width:100%}
@media(max-width:760px){main{grid-template-columns:1fr;height:calc(100dvh - 66px)}.verticalbar{right:10px;top:38%}#view{overflow:hidden}aside{position:fixed;left:8px;right:8px;top:auto;bottom:92px;width:auto;max-height:min(22dvh,190px);padding:12px;border:1px solid #ddd;border-radius:14px;box-shadow:0 4px 18px #0002;z-index:20;overflow-y:auto;overscroll-behavior:contain}aside.panel-hidden{transform:translateX(calc(100% + 18px))}.paneltab{position:fixed;right:0;bottom:150px;z-index:40;width:44px;height:58px;border-radius:12px 0 0 12px;font-size:24px;display:none;background:#fff}.paneltab.show{display:block}.panelhide{position:sticky;top:0;float:right;z-index:3;margin:-5px -5px 6px 8px;padding:6px 9px;font-size:12px;background:#fff;border:1px solid #aaa}.scrollcue{display:block}.row{flex-wrap:wrap}button{padding:7px 8px}}
</style>
</head>
<body>
<header><b>施術者のための身体の地図</b><div class="sub">右股関節・深層外旋筋群｜3D Prototype 0.3</div></header>
<main><div id="view"><div class="hint">ドラッグ：回転　ピンチ/ホイール：拡大縮小</div></div>
<aside>
<button id="panelHide" class="panelhide" aria-label="表示パネルをしまう">しまう ›</button>
<h2>表示を重ねる・外す</h2>
<div class="row"><button id="bones">骨だけ</button><button id="all" class="primary">すべて</button></div>
<div id="items"></div>
<h2>骨の透明度</h2><input id="opacity" type="range" min="0" max="1" step=".05" value=".28">
<div class="row" style="margin-top:12px"><button id="reset">視点を戻す</button></div>
</aside><button id="panelTab" class="paneltab" aria-label="表示パネルを開く">‹</button></main><div class="verticalbar" aria-label="人体位置"><button id="moveUp" aria-label="上へ移動">↑</button><button id="moveLeft" aria-label="左へ移動">←</button><button id="padHandle" aria-label="方向キーを移動" title="ここをドラッグして方向キーを移動">●</button><button id="moveRight" aria-label="右へ移動">→</button><button id="moveDown" aria-label="下へ移動">↓</button></div><div class="modebar" aria-label="3D操作"><button id="lock" class="active" aria-pressed="true">🔒 固定中</button><button id="rotate" class="active" aria-pressed="true">↻ 回転中</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const labels={
right_hip_bone:"右寛骨",right_femur:"右大腿骨",right_obturator_internus:"内閉鎖筋",
right_superior_gemellus:"上双子筋",right_inferior_gemellus:"下双子筋",right_piriformis:"梨状筋",
right_quadratus_femoris:"大腿方形筋",right_obturator_externus:"外閉鎖筋"};
const boneNames=new Set(["right_hip_bone","right_femur"]);
const host=document.getElementById('view'), scene=new THREE.Scene(); scene.background=new THREE.Color(0xf6f3ed);
const camera=new THREE.PerspectiveCamera(38,1,.1,2000); camera.position.set(260,-330,180);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
controls.enablePan=false;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
renderer.domElement.style.touchAction='none';
const lockBtn=document.getElementById('lock'), rotateBtn=document.getElementById('rotate');
let positionLocked=true, rotationEnabled=true;
function syncModes(){
 controls.enablePan=!positionLocked;
 controls.enableRotate=rotationEnabled;
 controls.touches.ONE=positionLocked?THREE.TOUCH.ROTATE:THREE.TOUCH.PAN;
 controls.mouseButtons.LEFT=positionLocked?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN;
 controls.screenSpacePanning=true;
 lockBtn.classList.toggle('active',positionLocked);
 lockBtn.setAttribute('aria-pressed',String(positionLocked));
 lockBtn.textContent=positionLocked?'🔒 固定中':'🔓 固定解除';
 rotateBtn.classList.toggle('active',rotationEnabled);
 rotateBtn.setAttribute('aria-pressed',String(rotationEnabled));
 rotateBtn.textContent=rotationEnabled?'↻ 回転中':'↻ 回転OFF';
}
lockBtn.onclick=()=>{
 positionLocked=!positionLocked;
 controls.enabled=false;
 syncModes();
 requestAnimationFrame(()=>{controls.enabled=true});
};
rotateBtn.onclick=()=>{rotationEnabled=!rotationEnabled;syncModes()};
const moveStep=()=>{
 const d=camera.position.distanceTo(controls.target);
 return Math.max(d*.0183,.12);
};
function moveVertical(dir){
 const amount=moveStep()*dir;
 const up=new THREE.Vector3(0,1,0).multiplyScalar(amount);
 controls.target.add(up);
 camera.position.add(up);
 controls.update();
}
function bindVertical(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveVertical(dir);timer=setInterval(()=>moveVertical(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindVertical('moveUp',-1); bindVertical('moveDown',1);
function moveHorizontal(dir){
 const amount=moveStep()*dir;
 const right=new THREE.Vector3();
 camera.getWorldDirection(right);
 right.cross(camera.up).normalize().multiplyScalar(amount);
 controls.target.add(right);
 camera.position.add(right);
 controls.update();
}
function bindHorizontal(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveHorizontal(dir);timer=setInterval(()=>moveHorizontal(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindHorizontal('moveLeft',1); bindHorizontal('moveRight',-1);
const pad=document.querySelector('.verticalbar'), padHandle=document.getElementById('padHandle');
let padDrag=null;
padHandle.addEventListener('pointerdown',e=>{
 e.preventDefault(); e.stopPropagation();
 const r=pad.getBoundingClientRect();
 padDrag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};
 padHandle.setPointerCapture?.(e.pointerId);
});
padHandle.addEventListener('pointermove',e=>{
 if(!padDrag||e.pointerId!==padDrag.id)return;
 const r=pad.getBoundingClientRect(), margin=6;
 const left=Math.min(Math.max(margin,e.clientX-padDrag.dx),window.innerWidth-r.width-margin);
 const top=Math.min(Math.max(margin,e.clientY-padDrag.dy),window.innerHeight-r.height-margin);
 pad.style.left=left+'px'; pad.style.top=top+'px'; pad.style.right='auto'; pad.style.transform='none';
});
const endPadDrag=e=>{if(padDrag&&e.pointerId===padDrag.id)padDrag=null};
padHandle.addEventListener('pointerup',endPadDrag);
padHandle.addEventListener('pointercancel',endPadDrag);
syncModes();
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));
const dl=new THREE.DirectionalLight(0xffffff,2.0); dl.position.set(2,-3,4); scene.add(dl);
let objects={}, boneOpacity=.28;

function visibleBounds(){
 const box=new THREE.Box3(), tmp=new THREE.Box3();
 scene.updateMatrixWorld(true);
 scene.traverse(o=>{
  if(!o.isMesh||!o.visible)return;
  let p=o.parent,shown=true;
  while(p&&p!==scene){if(!p.visible){shown=false;break}p=p.parent}
  if(!shown)return;
  if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
  tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); box.union(tmp);
 });
 return box;
}
function fit(){
 const box=visibleBounds(); if(box.isEmpty())return;
 const c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const vfov=THREE.MathUtils.degToRad(camera.fov);
 const hfov=2*Math.atan(Math.tan(vfov/2)*Math.max(camera.aspect,.01));
 const distH=(size.y*.5)/Math.tan(vfov/2);
 const distW=(size.x*.5)/Math.tan(hfov/2);
 const dist=Math.max(distH,distW,size.z*.8)*1.18;
 controls.target.copy(c);
 camera.up.set(0,1,0);
 // Converted BP3D is Y-up. Look straight at the body along +Z.
 camera.position.set(c.x,c.y,c.z+dist);
 camera.near=Math.max(dist/1000,.01);camera.far=Math.max(dist*12,100);
 camera.updateProjectionMatrix();controls.update();
}
function materialize(o,isBone){
 o.traverse(x=>{if(x.isMesh){
   x.material=new THREE.MeshStandardMaterial({color:isBone?0xd8d2c7:0xb76555,roughness:.72,metalness:0,transparent:isBone,opacity:isBone?boneOpacity:1,side:THREE.DoubleSide});
   if(!isBone){
     const edges=new THREE.LineSegments(
       new THREE.EdgesGeometry(x.geometry,28),
       new THREE.LineBasicMaterial({color:0x5f2f29,transparent:true,opacity:.72})
     );
     edges.name='muscle_outline_test';
     edges.renderOrder=3;
     x.add(edges);
   }
 }})
}
// Anatomy asset source can be switched here after license/asset validation.
const MODEL_URL='./body_map_prototype02_web_v0.1.glb';
const FULL_SKELETON_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/skeleton.glb';
const FULL_ANATOMY_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb';
const loader=new GLTFLoader();

// BodyParts3D -> Three.js: X=left/right, Z=up, -Y=front/back.
let bpCenter=null,bpScale=null,fullSkeletonReady=false,fullAnatomyReady=false,fullBodyFitted=false;
function transformBP3D(root,center,scale){
 root.updateMatrixWorld(true);
 root.traverse(o=>{
  if(!o.isMesh)return;
  const g=o.geometry.clone();
  // Bake any GLTF node transform before converting BP3D axes.
  g.applyMatrix4(o.matrixWorld);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
   const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
   p.setXYZ(i,(x-center.x)*scale,(z-center.z)*scale,-(y-center.y)*scale);
  }
  p.needsUpdate=true;
  // Recompute normals after axis conversion to avoid inherited orientation errors.
  g.deleteAttribute('normal'); g.computeVertexNormals(); g.computeBoundingBox(); g.computeBoundingSphere();
  o.geometry=g; o.position.set(0,0,0);o.rotation.set(0,0,0);o.scale.set(1,1,1);o.updateMatrix();
 });
 root.position.set(0,0,0);root.rotation.set(0,0,0);root.scale.set(1,1,1);root.updateMatrixWorld(true);
}
function fitFullBodyWhenReady(){
 if(!fullSkeletonReady||!fullAnatomyReady||fullBodyFitted)return;
 fullBodyFitted=true; requestAnimationFrame(()=>requestAnimationFrame(fit));
}

// Preflight only: verify the full skeleton can be fetched/decoded without replacing the current model.
let fullSkeleton=null;
loader.load(FULL_SKELETON_URL,g=>{
 fullSkeleton=g.scene;
 fullSkeleton.visible=false;
 fullSkeleton.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0xd8d2c7,roughness:.72,metalness:0,transparent:true,opacity:.32,side:THREE.DoubleSide})}});
 scene.add(fullSkeleton);
 fullSkeletonReady=true;
 if(bpCenter&&bpScale){transformBP3D(fullSkeleton,bpCenter,bpScale);fullSkeleton.visible=!!fullAnatomy?.visible;fitFullBodyWhenReady()}
 console.info('[BodyMap] full skeleton preflight OK',fullSkeleton);
 const btn=document.createElement('button');
 btn.id='fullSkeletonTest';
 btn.textContent='全身骨格テスト';
 btn.title='全身骨格の読み込み確認用';
 document.querySelector('aside')?.appendChild(btn);
 btn.onclick=()=>{
   const show=!fullSkeleton.visible;
   fullSkeleton.visible=show;
   Object.values(objects).forEach(o=>o.visible=!show);
   btn.textContent=show?'元のモデルに戻す':'全身骨格テスト';
   if(show) fit();
 };
},undefined,e=>{
 console.warn('[BodyMap] full skeleton preflight failed',e);
});

let fullAnatomy=null;
loader.load(FULL_ANATOMY_URL,g=>{
 fullAnatomy=g.scene;
 const rawBox=new THREE.Box3().setFromObject(fullAnatomy);
 bpCenter=rawBox.getCenter(new THREE.Vector3());
 const rawSize=rawBox.getSize(new THREE.Vector3());
 bpScale=30/Math.max(rawSize.z,1e-6);
 transformBP3D(fullAnatomy,bpCenter,bpScale);
 if(fullSkeletonReady)transformBP3D(fullSkeleton,bpCenter,bpScale);
 fullAnatomy.visible=false;
 fullAnatomy.traverse(o=>{if(o.isMesh){o.material=new THREE.MeshStandardMaterial({color:0xb76555,roughness:.72,metalness:0,side:THREE.DoubleSide})}});
 scene.add(fullAnatomy);
 fullAnatomyReady=true;
 const wanted=['right_gluteus_maximus','right_gluteus_medius','right_gluteus_minimus','right_piriformis','right_obturator_internus','right_obturator_externus','right_gemellus_superior','right_gemellus_inferior','right_quadratus_femoris','right_tensor_fasciae_latae','right_rectus_femoris','right_vastus_lateralis','right_vastus_medialis','right_vastus_intermedius','right_sartorius','right_adductor_longus','right_adductor_brevis','right_adductor_magnus','right_semitendinosus','right_semimembranosus','long_head_of_right_biceps_femoris','short_head_of_right_biceps_femoris'];
 let kept=0;
 fullAnatomy.traverse(o=>{
   if(!o.isMesh)return;
   const n=(o.name||'').toLowerCase();
   const keep=wanted.some(w=>n.includes(w));
   o.visible=keep;
   if(keep)kept++;
 });
 console.info('[BodyMap] right hip/thigh muscle test ready',kept);
 // Promote the validated whole skeleton + right hip/thigh set to the default prototype view.
 fullAnatomy.visible=true;
 if(fullSkeleton) fullSkeleton.visible=true;
 Object.values(objects).forEach(o=>o.visible=false);
 fitFullBodyWhenReady();
 const btn=document.createElement('button');
 btn.id='hipMuscleTest';
 btn.textContent='右股関節・大腿筋テスト';
 btn.title='右股関節から大腿の筋群をまとめて確認';
 document.querySelector('aside')?.appendChild(btn);
 btn.onclick=()=>{
   const show=!fullAnatomy.visible;
   fullAnatomy.visible=show;
   if(fullSkeleton) fullSkeleton.visible=show;
   Object.values(objects).forEach(o=>o.visible=!show);
   btn.textContent=show?'元のモデルに戻す':'全身＋右股関節・大腿筋を表示';
   if(show) fit();
 };
},undefined,e=>console.warn('[BodyMap] anatomy test load failed',e));

loader.load(MODEL_URL,g=>{
 scene.add(g.scene);
 g.scene.traverse(o=>{
   let key=Object.keys(labels).find(k=>o.name.includes(k));
   if(!key) return; objects[key]=o; materialize(o,boneNames.has(key));
 });
 const list=document.getElementById('items');
 Object.entries(labels).forEach(([k,v])=>{
   if(!objects[k])return;
   const d=document.createElement('label'); d.className='item'; d.innerHTML=`<span>${v}</span><input type="checkbox" checked>`;
   d.querySelector('input').onchange=e=>objects[k].visible=e.target.checked; list.appendChild(d);
 });
 if(!fullAnatomy?.visible) fit();
});
document.getElementById('bones').onclick=()=>Object.entries(objects).forEach(([k,o])=>o.visible=boneNames.has(k));
document.getElementById('all').onclick=()=>Object.values(objects).forEach(o=>o.visible=true);
document.getElementById('opacity').oninput=e=>{
 boneOpacity=+e.target.value;
 boneNames.forEach(k=>objects[k]?.traverse(x=>{if(x.isMesh){x.material.transparent=true;x.material.opacity=boneOpacity;x.material.needsUpdate=true}}));
 fullSkeleton?.traverse(x=>{if(x.isMesh){x.material.transparent=true;x.material.opacity=boneOpacity;x.material.needsUpdate=true}});
};
document.getElementById('reset').onclick=fit;
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
<script>
(()=>{
  const panel=document.querySelector('aside');
  const tab=document.getElementById('panelTab');
  const closeBtn=document.getElementById('panelHide');
  const view=document.getElementById('view');
  if(panel&&tab&&closeBtn){
    closeBtn.addEventListener('click',()=>{
      panel.style.transform='translateX(calc(100vw + 24px))';
      tab.style.display='block';
    });
    tab.addEventListener('click',()=>{
      panel.style.transform='translateX(0)';
      tab.style.display='none';
    });
  }
  if(view) view.style.touchAction='none';
})();
</script>
</body></html>
