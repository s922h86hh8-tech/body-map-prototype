name: L3 v4.1 numeric class 5 spatial localization (4 references; no anatomy guess)
on:
  push:
    branches: [cleanroom-pelvis-v0.1]
    paths: ['.github/workflows/l3-numeric-class5-localization-v4.1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  class5-locations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case_index: [0, 54, 65, 87]
    env:
      CASE_INDEX: ${{ matrix.case_index }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy scipy scikit-image nibabel trimesh requests remotezip
      - name: Export three model revisions without changing existing files
        run: |
          node experiments/tools/export-l3-model.cjs "$RUNNER_TEMP/v24.obj" high
          node experiments/tools/export-l3-model-v3.3-research.cjs "$RUNNER_TEMP/v33.obj" high
          node experiments/tools/export-l3-model-v3.5-research.cjs "$RUNNER_TEMP/v35.obj" high
      - name: Fetch only one public Zenodo labeled mask via HTTP range
        run: |
          python - <<'PY'
          import os,requests,re,hashlib,json
          from remotezip import RemoteZip
          record=requests.get('https://zenodo.org/api/records/7181338',timeout=40).json()
          archive=next(i for i in record['files'] if i['key']=='L1-L5FineSegMix-663case.zip')
          if archive['checksum']!='md5:baf6374a927e9591dbae3314570bdb1e':raise ValueError('unexpected source checksum')
          with RemoteZip(archive['links'].get('self') or archive['links'].get('content')) as zipf:
              files=sorted([i for i in zipf.infolist() if re.search(r'_L3_seg[.]nii[.]gz$',i.filename,re.I)
                            and not i.filename.startswith('__MACOSX/')],
                           key=lambda f:(f.file_size,f.filename))
              if len(files)!=108:raise ValueError('expected 108 L3 masks')
              blob=zipf.read(files[int(os.environ['CASE_INDEX'])])
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mask.nii.gz'),'wb') as f:f.write(blob)
          print('REFERENCE_HASH',json.dumps({'index':os.environ['CASE_INDEX'],'sha256':hashlib.sha256(blob).hexdigest()}))
          PY
      - name: Analyze class 5 and all seven numeric class spatial locations
        run: |
          python experiments/tools/compare-l3-numeric-subregions-v4.1.py \
            --mask "$RUNNER_TEMP/mask.nii.gz" --v24 "$RUNNER_TEMP/v24.obj" \
            --v33 "$RUNNER_TEMP/v33.obj" --v35 "$RUNNER_TEMP/v35.obj" \
            --samples 7000 --out "$RUNNER_TEMP/analysis.json"
      - name: Report aggregate spatial coordinates and summary only
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'analysis.json').read_text())
          sig=r['numeric_label_spatial_signature_unverified_anatomy']
          scores={str(i):{v:r['results'][v]['by_numeric_label_only'][str(i)].get('p95_mm')
                           for v in ['v24','v33','v35']} for i in range(1,8)}
          print('L3_NUMERIC_CLASS_SPATIAL '+json.dumps({
              'case_index':os.environ['CASE_INDEX'],
              'registration':r['registration'],
              'crop':r['reference_crop_diagnostic'],
              'class_5_signature':sig.get('5'),
              'other_class_centroids':{k:v.get('centroid_xyz_mm') for k,v in sig.items() if k!='5'},
              'class_P95_mm':scores,'anatomical_labels_not_mapped':True,
              'anatomical_approval':False},ensure_ascii=False))
          PY
      - name: Discard CT mask and generated meshes and private report
        if: always()
        run: rm -f "$RUNNER_TEMP/mask.nii.gz" "$RUNNER_TEMP/v24.obj" "$RUNNER_TEMP/v33.obj" "$RUNNER_TEMP/v35.obj" "$RUNNER_TEMP/analysis.json"
