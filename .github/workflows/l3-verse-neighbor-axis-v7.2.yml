name: L3 VerSe neighbor order v7.2 numeric cross-check (NOT anatomy approval)

on:
  push:
    branches: [l3-reference-method-evaluation-v1]
    paths:
      - 'experiments/tools/audit-verse-l3-neighbor-axis-v7.2.py'
      - 'experiments/tests/test-verse-l3-neighbor-axis-v7.2.py'
      - '.github/workflows/l3-verse-neighbor-axis-v7.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-axis-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependency
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run eight synthetic numeric guards
        run: |
          python -m py_compile experiments/tools/audit-verse-l3-neighbor-axis-v7.2.py experiments/tests/test-verse-l3-neighbor-axis-v7.2.py
          python experiments/tests/test-verse-l3-neighbor-axis-v7.2.py -v

  two-real-pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: synthetic-axis-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: verse005
            ct_sha: bbf7e9ee9576d8b85784112e15f5df3a0877d7a574e733497c2ac7fd143c7cfa
            seg_sha: d56af4e19b21f1335b156e66ef3f7d487be11fb3e2b545496f0675050a30f2b5
          - case_id: verse008
            ct_sha: 107b238f3e3fc85eec71c687cc56df825c4cde81d22b4b905a6f497193b44b31
            seg_sha: 00cb18b24858f9984c98a0379e4e0e9e063b26848ac9ce96c7fa637856fcc8f3
    env:
      CASE_ID: ${{ matrix.case_id }}
      EXPECTED_CT_SHA: ${{ matrix.ct_sha }}
      EXPECTED_SEG_SHA: ${{ matrix.seg_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source readers
        run: python -m pip install --disable-pip-version-check numpy nibabel
      - name: Fetch and pin exact previously screened source medical volumes
        run: |
          set -euo pipefail
          BASE="https://huggingface.co/datasets/MedOtter/VERSE20/resolve/main/VERSE20/01_training/$CASE_ID"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$BASE/${CASE_ID}.nii.gz" --output "$RUNNER_TEMP/case_ct.nii.gz"
          curl --fail --location --retry 2 --connect-timeout 25 --max-time 180 --silent --show-error "$BASE/${CASE_ID}_seg.nii.gz" --output "$RUNNER_TEMP/case_seg.nii.gz"
          echo "$EXPECTED_CT_SHA  $RUNNER_TEMP/case_ct.nii.gz" | sha256sum -c -
          echo "$EXPECTED_SEG_SHA  $RUNNER_TEMP/case_seg.nii.gz" | sha256sum -c -
      - name: Compare centroid relative RAS superior order without claiming anatomy
        run: |
          python experiments/tools/audit-verse-l3-neighbor-axis-v7.2.py \
            --ct "$RUNNER_TEMP/case_ct.nii.gz" \
            --seg "$RUNNER_TEMP/case_seg.nii.gz" \
            --case-id "$CASE_ID" \
            --out "$RUNNER_TEMP/private_numeric_summary.json"
      - name: Erase reference volumes and derived report
        if: always()
        run: rm -f "$RUNNER_TEMP/case_ct.nii.gz" "$RUNNER_TEMP/case_seg.nii.gz" "$RUNNER_TEMP/private_numeric_summary.json"
