<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const pageParams=new URLSearchParams(location.search);
let diagFullbodyReady=false;
function diagnosticFit(){
 const targetRoot=fullSkeleton||fullAnatomy;
 if(!targetRoot)return;
 resize();
 const box=new THREE.Box3().setFromObject(targetRoot);
 if(box.isEmpty())return;
 const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const halfV=THREE.MathUtils.degToRad(camera.fov)/2;
 const halfH=Math.atan(Math.tan(halfV)*Math.max(camera.aspect,.1));
 const distV=(size.y/2)/Math.tan(halfV);
 const distH=(size.x/2)/Math.tan(halfH);
 const distance=Math.max(distV,distH,size.z,1)*1.45;
 controls.target.copy(center);
 camera.up.set(0,1,0);
 camera.position.copy(center).add(new THREE.Vector3(0,0,distance));
 camera.near=Math.max(distance/2000,.01);
 camera.far=Math.max(distance*20,150);
 camera.lookAt(center);
 camera.updateProjectionMatrix();
 controls.update();
}
const focusKey=(pageParams.get('focus')||'').toLowerCase().replace(/[ -]+/g,'_');
if(pageParams.get('embed')==='1')document.body.classList.add('embed');
const guideBack=document.getElementById('guideBack');
const guideTarget=document.getElementById('guideTarget');
if(pageParams.get('guide')==='1'){
 document.body.classList.add('guide');
 const focusLabels={
  obturator_internus:'内閉鎖筋',
  piriformis:'梨状筋',
  gemellus_superior:'上双子筋',
  gemellus_inferior:'下双子筋',
  quadratus_femoris:'大腿方形筋'
 };
 guideBack.classList.add('show');
 guideTarget.textContent=(focusLabels[focusKey]||'選択構造')+'｜3D';
 guideTarget.classList.add('show');
 guideBack.onclick=()=>{if(history.length>1)history.back();else location.href='./test.html'};
 if(matchMedia('(max-width:760px)').matches){
  const p=document.querySelector('aside'),tab=document.getElementById('panelTab');
  if(p&&tab){p.style.transform='translateX(calc(100vw + 24px))';tab.style.display='block'}
 }
}

const host=document.getElementById('view'), scene=new THREE.Scene(); scene.background=new THREE.Color(0xf6f3ed);
const camera=new THREE.PerspectiveCamera(38,1,.1,2000); camera.position.set(260,-330,180);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
controls.enablePan=false;
controls.touches.ONE=THREE.TOUCH.ROTATE;
controls.touches.TWO=THREE.TOUCH.DOLLY_ROTATE;
renderer.domElement.style.touchAction='none';
const lockBtn=document.getElementById('lock'), rotateBtn=document.getElementById('rotate');
let positionLocked=true, rotationEnabled=true;
function syncModes(){
 controls.enablePan=!positionLocked;
 controls.enableRotate=rotationEnabled;
 controls.touches.ONE=positionLocked?THREE.TOUCH.ROTATE:THREE.TOUCH.PAN;
 controls.mouseButtons.LEFT=positionLocked?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN;
 controls.screenSpacePanning=true;
 lockBtn.classList.toggle('active',positionLocked);
 lockBtn.setAttribute('aria-pressed',String(positionLocked));
 lockBtn.textContent=positionLocked?'🔒 固定中':'🔓 固定解除';
 rotateBtn.classList.toggle('active',rotationEnabled);
 rotateBtn.setAttribute('aria-pressed',String(rotationEnabled));
 rotateBtn.textContent=rotationEnabled?'↻ 回転中':'↻ 回転OFF';
}
lockBtn.onclick=()=>{
 positionLocked=!positionLocked;
 controls.enabled=false;
 syncModes();
 requestAnimationFrame(()=>{controls.enabled=true});
};
rotateBtn.onclick=()=>{rotationEnabled=!rotationEnabled;syncModes()};
const moveStep=()=>{
 const d=camera.position.distanceTo(controls.target);
 return Math.max(d*.0183,.12);
};
function moveVertical(dir){
 const amount=moveStep()*dir;
 const up=new THREE.Vector3(0,1,0).multiplyScalar(amount);
 controls.target.add(up);
 camera.position.add(up);
 controls.update();
}
function bindVertical(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveVertical(dir);timer=setInterval(()=>moveVertical(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindVertical('moveUp',-1); bindVertical('moveDown',1);
function moveHorizontal(dir){
 const amount=moveStep()*dir;
 const right=new THREE.Vector3();
 camera.getWorldDirection(right);
 right.cross(camera.up).normalize().multiplyScalar(amount);
 controls.target.add(right);
 camera.position.add(right);
 controls.update();
}
function bindHorizontal(id,dir){
 const b=document.getElementById(id);
 let timer=null;
 const stop=()=>{if(timer){clearInterval(timer);timer=null}};
 b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);moveHorizontal(dir);timer=setInterval(()=>moveHorizontal(dir),55)});
 b.addEventListener('pointerup',stop); b.addEventListener('pointercancel',stop); b.addEventListener('pointerleave',stop);
}
bindHorizontal('moveLeft',1); bindHorizontal('moveRight',-1);
const pad=document.querySelector('.verticalbar'), padHandle=document.getElementById('padHandle');
let padDrag=null;
padHandle.addEventListener('pointerdown',e=>{
 e.preventDefault(); e.stopPropagation();
 const r=pad.getBoundingClientRect();
 padDrag={id:e.pointerId,dx:e.clientX-r.left,dy:e.clientY-r.top};
 padHandle.setPointerCapture?.(e.pointerId);
});
padHandle.addEventListener('pointermove',e=>{
 if(!padDrag||e.pointerId!==padDrag.id)return;
 const r=pad.getBoundingClientRect(), margin=6;
 const left=Math.min(Math.max(margin,e.clientX-padDrag.dx),window.innerWidth-r.width-margin);
 const top=Math.min(Math.max(margin,e.clientY-padDrag.dy),window.innerHeight-r.height-margin);
 pad.style.left=left+'px'; pad.style.top=top+'px'; pad.style.right='auto'; pad.style.transform='none';
});
const endPadDrag=e=>{if(padDrag&&e.pointerId===padDrag.id)padDrag=null};
padHandle.addEventListener('pointerup',endPadDrag);
padHandle.addEventListener('pointercancel',endPadDrag);
syncModes();
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2.4));
const dl=new THREE.DirectionalLight(0xffffff,2.0); dl.position.set(2,-3,4); scene.add(dl);
let boneOpacity=.28;
let renderPreset='adjusted';
function applyBoneMaterials(){
 if(!fullSkeleton)return;
 fullSkeleton.traverse(mesh=>{
  if(!mesh.isMesh||!mesh.material)return;
  const mat=mesh.material;
  mat.transparent=true;
  mat.opacity=boneOpacity;
  mat.depthTest=renderPreset!=='xray';
  mat.depthWrite=renderPreset==='baseline';
  mat.side=THREE.DoubleSide;
  mesh.renderOrder=renderPreset==='xray'?10:0;
  mat.needsUpdate=true;
 });
 updateDiagnosticStats();
}
let previousAnatomyMode=null;
function applyAnatomyMaterials(){
 if(!fullAnatomy)return;
 const mode=renderPreset==='mixed'?'mixed':'original';
 if(previousAnatomyMode===mode)return;
 previousAnatomyMode=mode;
 fullAnatomy.traverse(mesh=>{
  if(!mesh.isMesh||!mesh.material)return;
  const mat=mesh.material;
  mat.transparent=mode==='mixed';
  mat.opacity=mode==='mixed'?.42:1;
  mat.depthWrite=mode!=='mixed';
  mat.depthTest=true;
  mat.needsUpdate=true;
 });
}
function updateDiagnosticStats(){
 const bones=fullSkeleton?countMeshes(fullSkeleton):'未読み込み';
 const anatomy=fullAnatomy?countMeshes(fullAnatomy):'未読み込み';
 const names={baseline:'A 現行方式',adjusted:'B depthWrite OFF',xray:'C 前面表示',mixed:'D 筋を半透明'};
 const e=document.getElementById('diagStats');
 if(e)e.textContent='骨 '+bones+'メッシュ｜筋ほか '+anatomy+'メッシュ｜骨不透明度 '+Math.round(boneOpacity*100)+'％';
}
function countMeshes(root){let n=0;root.traverse(x=>{if(x.isMesh)n++});return n;}
function changeRenderingPreset(value){
 renderPreset=value;
 applyAnatomyMaterials();
 applyBoneMaterials();
 updateDiagnosticStats();
 const titles={baseline:'A：現行方式',adjusted:'B：骨の奥行き書込OFF',xray:'C：骨を前面（診断用）',mixed:'D：筋も半透明（診断用）'};
 document.getElementById('diagCurrent').textContent=titles[value];
 [['diagA','baseline'],['diagB','adjusted'],['diagC','xray'],['diagD','mixed']].forEach(([id,preset])=>{
   const b=document.getElementById(id),selected=preset===value;
   b.classList.toggle('primary',selected);
   b.setAttribute('aria-pressed',String(selected));
 });
}

function visibleBounds(){
 const box=new THREE.Box3(), tmp=new THREE.Box3();
 scene.updateMatrixWorld(true);
 scene.traverse(o=>{
  if(!o.isMesh||!o.visible)return;
  let p=o.parent,shown=true;
  while(p&&p!==scene){if(!p.visible){shown=false;break}p=p.parent}
  if(!shown)return;
  if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
  tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld); box.union(tmp);
 });
 return box;
}
function fit(){
 const box=visibleBounds(); if(box.isEmpty())return;
 const c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const vfov=THREE.MathUtils.degToRad(camera.fov);
 const hfov=2*Math.atan(Math.tan(vfov/2)*Math.max(camera.aspect,.01));
 const distH=(size.y*.5)/Math.tan(vfov/2);
 const distW=(size.x*.5)/Math.tan(hfov/2);
 const dist=Math.max(distH,distW,size.z*.8)*1.18;
 controls.target.copy(c);
 camera.up.set(0,1,0);
 // Converted BP3D is Y-up. Look straight at the body along +Z.
 camera.position.set(c.x,c.y,c.z+dist);
 camera.near=Math.max(dist/1000,.01);camera.far=Math.max(dist*12,100);
 camera.updateProjectionMatrix();controls.update();
}
function fitToMeshes(meshes,padding=3.2){
 const box=new THREE.Box3(),tmp=new THREE.Box3();
 scene.updateMatrixWorld(true);
 meshes.forEach(o=>{
  if(!o.geometry.boundingBox)o.geometry.computeBoundingBox();
  tmp.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);box.union(tmp);
 });
 if(box.isEmpty())return;
 const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
 const vfov=THREE.MathUtils.degToRad(camera.fov);
 const hfov=2*Math.atan(Math.tan(vfov/2)*Math.max(camera.aspect,.01));
 const distH=(size.y*.5)/Math.tan(vfov/2);
 const distW=(size.x*.5)/Math.tan(hfov/2);
 const dist=Math.max(distH,distW,size.z*.8,.7)*padding;
 controls.target.copy(center);
 camera.up.set(0,1,0);
 camera.position.set(center.x,center.y,center.z+dist);
 camera.near=Math.max(dist/1000,.01);camera.far=Math.max(dist*20,100);
 camera.updateProjectionMatrix();controls.update();
}
const FULL_SKELETON_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/skeleton.glb';
const FULL_ANATOMY_URL='https://raw.githubusercontent.com/JohanBellander/BodyExplorer/main/public/anatomy.glb';
const loader=new GLTFLoader();

// BodyParts3D -> Three.js: X=left/right, Z=up, -Y=front/back.
let bpCenter=null,bpScale=null,fullSkeletonReady=false,fullAnatomyReady=false,fullBodyFitted=!!focusKey;
function transformBP3D(root,center,scale){
 root.updateMatrixWorld(true);
 root.traverse(o=>{
  if(!o.isMesh)return;
  const g=o.geometry.clone();
  // Bake any GLTF node transform before converting BP3D axes.
  g.applyMatrix4(o.matrixWorld);
  const p=g.attributes.position;

  if(/cartilage/.test(n))return '軟骨';
  if(/ligament/.test(n))return '靱帯';
  if(/fascia|iliotibial_tract/.test(n))return '筋膜・腱膜';
  if(/retinaculum/.test(n))return '支帯';
  if(/tendon|tendinous/.test(n))return '腱';
  if(/interosseous_membrane/.test(n))return '骨間膜';
  return '筋';
 }
 const deepRe=/piriformis|obturator|gemellus|quadratus_femoris|gluteus_minimus|supraspinatus|infraspinatus|subscapularis|teres_minor|rhomboid|multifidus|intercost|psoas|iliacus|popliteus|interosse|lumbrical|pronator_quadratus/i;
 const middleRe=/gluteus_medius|erector_spinae|serratus|brachialis|soleus|vastus_intermedius/i;
 const groups=new Map(regionDefs.map(([n])=>[n,[]]));groups.set('その他',[]);
 function regionFor(name){
  const neck=regionDefs.find(([label])=>label==='頸部');
  if(neck&&neck[1].test(name))return neck[0];
  if(/\bfoot\b/i.test(name)||/extensor[ _]hallucis[ _]brevis/i.test(name))return '足';
  if(/\bhand\b/i.test(name))return '手';
  const leg=regionDefs.find(([label])=>label==='下腿');
  if(leg&&leg[1].test(name))return leg[0];
  if(/flexor[ _]digitorum[ _]brevis/i.test(name))return '足';
  for(const [label,re] of regionDefs)if(label!=='頸部'&&re.test(name))return label;
  return 'その他'
 }
 function layerFor(name,region,type){
  if(type!=='筋')return '関連構造';
  const n=normName(name);
  if(region==='足'){
   if(/extensor_hallucis_brevis/.test(n))return '足背';
   if(/abductor_hallucis|flexor_digitorum_brevis|abductor_digiti_minimi/.test(n))return '第1層';
   if(/flexor_accessorius|lumbrical/.test(n))return '第2層';
   if(/flexor_hallucis_brevis|adductor_hallucis|flexor_digiti_minimi_brevis|opponens_digiti_minimi/.test(n))return '第3層';
   if(/plantar_interosse/.test(n))return '第4層';
  }
  if(region==='手'){
   if(/opponens_pollicis|opponens_digiti_minimi|adductor_pollicis|interosse/.test(n))return '深層';
   if(/lumbrical/.test(n))return '中間層';
   return '表層';
  }
  return deepRe.test(name)?'深層':middleRe.test(name)?'中間層':'表層'
 }
 function layerOrderFor(region){
  if(region==='足')return ['足背','第1層','第2層','第3層','第4層','関連構造'];
  return ['表層','中間層','深層','関連構造'];
 }
 const anatomyUiEntries=new Map();
 fullAnatomy.traverse(o=>{
  if(!o.isMesh)return;
  muscleMeshes.push(o);
  const raw=o.name||'名称未設定',key=canonicalMeshName(raw);
  let entry=anatomyUiEntries.get(key);
  if(!entry){
   const region=regionFor(raw),type=structureType(raw),layer=layerFor(raw,region,type);
   entry={raw,region,type,layer,meshes:[]};anatomyUiEntries.set(key,entry);
  }
  entry.meshes.push(o);
 });
 anatomyUiEntries.forEach(entry=>{
  const {raw,region,type,layer,meshes}=entry;
  const d=document.createElement('label');d.className='item muscleHidden';d.dataset.region=region;d.dataset.layer=layer;
  const s=document.createElement('span');s.textContent=sideName(raw)+japaneseName(raw)+(type==='筋'?'':'［'+type+'］');
  const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.addEventListener('change',()=>{meshes.forEach(m=>m.visible=cb.checked)});
  d.append(s,cb);muscleItems.appendChild(d);groups.get(region).push({el:d,meshes,layer,type,raw});
 });
 let activeRegion=null;
 function showRegion(region){
  activeRegion=activeRegion===region?null:region; muscleItems.innerHTML='';
  muscleRegions.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.region===activeRegion));
  if(!activeRegion)return;
  const entries=groups.get(activeRegion)||[];
  layerOrderFor(activeRegion).forEach(layer=>{
   const layerEntries=entries.filter(x=>x.layer===layer);if(!layerEntries.length)return;
   const head=document.createElement('label');head.className='item muscleGroupTitle';
   const title=document.createElement('span');title.textContent=layer+'（'+layerEntries.length+'）';
   const master=document.createElement('input');master.type='checkbox';master.checked=layerEntries.every(x=>x.meshes.every(m=>m.visible));
   master.onchange=()=>{layerEntries.forEach(x=>{x.meshes.forEach(m=>m.visible=master.checked);x.el.querySelector('input').checked=master.checked})};
   head.append(title,master);muscleItems.appendChild(head);
   layerEntries.forEach(x=>{x.el.classList.remove('muscleHidden');muscleItems.appendChild(x.el)});
  });
 }
 groups.forEach((items,label)=>{if(!items.length)return;const btn=document.createElement('button');btn.className='regionBtn';btn.dataset.region=label;btn.textContent=label+'（'+items.length+'）';btn.onclick=()=>showRegion(label);muscleRegions.appendChild(btn)});

 function applyFocusFromQuery(){
  if(!focusKey)return;
  const matched=muscleMeshes.filter(o=>normName(o.name).includes(focusKey));
  if(!matched.length){console.warn('[BodyMap] focus target not found',focusKey);return}
  const selected=new Set(matched);
  muscleMeshes.forEach(o=>{o.visible=selected.has(o)});
  groups.forEach(es=>es.forEach(x=>{const cb=x.el.querySelector('input');if(cb)cb.checked=x.meshes.every(m=>m.visible)}));
  const targetRegion=regionFor(matched[0].name);
  activeRegion=null;showRegion(targetRegion);
  requestAnimationFrame(()=>requestAnimationFrame(()=>fitToMeshes(matched,3.4)));
  console.info('[BodyMap] focused structure',focusKey,matched.map(o=>o.name));
 }
 applyFocusFromQuery();

 document.getElementById('musclesOn').onclick=()=>{muscleMeshes.forEach(o=>o.visible=true);groups.forEach(es=>es.forEach(x=>x.el.querySelector('input').checked=true));if(activeRegion){const r=activeRegion;activeRegion=null;showRegion(r)}};
 document.getElementById('musclesOff').onclick=()=>{muscleMeshes.forEach(o=>o.visible=false);groups.forEach(es=>es.forEach(x=>x.el.querySelector('input').checked=false));if(activeRegion){const r=activeRegion;activeRegion=null;showRegion(r)}};
 // Promote the validated whole skeleton + full skeletal-muscle anatomy to the default prototype view.
 fullAnatomy.visible=true;
 if(fullSkeleton) fullSkeleton.visible=true;
 fitFullBodyWhenReady();
},undefined,e=>console.warn('[BodyMap] anatomy test load failed',e));

document.getElementById('opacity').oninput=e=>{
 boneOpacity=+e.target.value;
 applyBoneMaterials();
};
[['diagA','baseline'],['diagB','adjusted'],['diagC','xray'],['diagD','mixed']].forEach(([id,preset])=>{
 document.getElementById(id).onclick=()=>changeRenderingPreset(preset);
});
document.getElementById('diagOnlyBones').onclick=()=>{
 document.getElementById('musclesOff').click();
 document.getElementById('diagOnlyBones').classList.add('primary');
 document.getElementById('diagShowMuscles').classList.remove('primary');
};
document.getElementById('diagShowMuscles').onclick=()=>{
 document.getElementById('musclesOn').click();
 document.getElementById('diagOnlyBones').classList.remove('primary');
 document.getElementById('diagShowMuscles').classList.add('primary');
};
document.getElementById('diagFit').onclick=diagnosticFit;
document.getElementById('diagOpacity').oninput=e=>{
 const slider=document.getElementById('opacity');
 slider.value=e.target.value;
 slider.dispatchEvent(new Event('input',{bubbles:true}));
 document.getElementById('diagOpacityText').textContent=Math.round(+e.target.value*100)+'％';
};
document.getElementById('diagToggle').onclick=()=>{
 const panel=document.getElementById('opacityDiag');
 panel.classList.toggle('minimized');
 const opened=!panel.classList.contains('minimized');
 document.getElementById('diagToggle').textContent=opened?'しまう':'表示';
 document.getElementById('diagToggle').setAttribute('aria-expanded',String(opened));
};
updateDiagnosticStats();
document.getElementById('reset').onclick=diagnosticFit;
function resize(){let w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()} addEventListener('resize',resize); resize();
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
