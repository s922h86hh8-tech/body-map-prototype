name: L3 v4.7 bidirectional holdout CT quality screen (RESEARCH ONLY)
on:
  push:
    branches: [cleanroom-pelvis-v0.1]
    paths: ['.github/workflows/l3-v47-bidirectional-holdout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-mathematics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy scipy scikit-image nibabel trimesh
      - run: python experiments/tools/compare-l3-bidirectional-holdout-v4.7.py --self-test
  four-not-tuned-holdout-cases:
    needs: test-mathematics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_index: 20
            sha256: 9a40214e92c50804af98263efc5fdb3ef66ef9871eb7ad6509218c0b1adcf7a5
          - case_index: 48
            sha256: bd18fe33b3dc94c0c2cd8bbe7ac0ef83797c8a150e733ba4b6c2f7a700424971
          - case_index: 83
            sha256: 1828b70ab75c212d7787d9a945661ccd2743ec39de2a0eeab8eb641b6f9b7d16
          - case_index: 102
            sha256: ff1d466ecd98d5ca7998c6b849beb0050aa8fc9df5bec63afa8df4dc4aaef827
    env:
      CASE_INDEX: ${{ matrix.case_index }}
      EXPECTED_SHA: ${{ matrix.sha256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check numpy scipy scikit-image nibabel trimesh requests remotezip
      - name: Export the retained baseline and two research hypotheses
        run: |
          node experiments/tools/export-l3-model.cjs "$RUNNER_TEMP/v24.obj" high
          node experiments/tools/export-l3-model-v3.3-research.cjs "$RUNNER_TEMP/v33.obj" high
          node experiments/tools/export-l3-model-v3.5-research.cjs "$RUNNER_TEMP/v35.obj" high
      - name: Read exactly one public anonymized L3 mask by ZIP byte range and verify hash
        run: |
          python - <<'PY'
          import hashlib,os,re,requests
          from remotezip import RemoteZip
          rec=requests.get('https://zenodo.org/api/records/7181338',timeout=35).json()
          f=next(x for x in rec['files'] if x['key']=='L1-L5FineSegMix-663case.zip')
          if f['checksum']!='md5:baf6374a927e9591dbae3314570bdb1e':
              raise ValueError('Unexpected source archive')
          with RemoteZip(f['links'].get('self') or f['links'].get('content')) as z:
              files=sorted([x for x in z.infolist()
                if re.search(r'_L3_seg[.]nii[.]gz$',x.filename,re.I)
                and not x.filename.startswith('__MACOSX/')],
                key=lambda x:(x.file_size,x.filename))
              if len(files)!=108:raise ValueError('Dataset L3 inventory changed')
              raw=z.read(files[int(os.environ['CASE_INDEX'])])
          checksum=hashlib.sha256(raw).hexdigest()
          if checksum!=os.environ['EXPECTED_SHA']:
              raise ValueError('L3 mask checksum mismatch')
          with open(os.path.join(os.environ['RUNNER_TEMP'],'mask.nii.gz'),'wb') as fp:fp.write(raw)
          print('CT_MASK_INTEGRITY_OK case_index='+os.environ['CASE_INDEX'])
          PY
      - name: Compare both directions on the same fixed small-angle baseline alignment
        run: |
          python experiments/tools/compare-l3-bidirectional-holdout-v4.7.py \
            --mask "$RUNNER_TEMP/mask.nii.gz" \
            --v24 "$RUNNER_TEMP/v24.obj" --v33 "$RUNNER_TEMP/v33.obj" \
            --v35 "$RUNNER_TEMP/v35.obj" --samples 5000 \
            --out "$RUNNER_TEMP/private-v47.json"
      - name: Print anonymous aggregate deltas and no anatomy claims
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ['RUNNER_TEMP'])/'private-v47.json').read_text())
          metrics=d.get('metrics',{})
          out={'case_index':int(os.environ['CASE_INDEX']),
              'status':d['status'],
              'source_array_axes':d['header']['voxel_array_axis_codes'],
              'pose':d.get('pose',{}),
              'versions':{k:{axis:v[axis]['p95_mm'] for axis in
                  ['ct_to_model','model_to_ct','bidirectional']} for k,v in metrics.items()},
              'candidate_changes':d.get('candidate_changes_from_v24'),
              'anatomical_names_verified':False,
              'anatomical_landmarks_verified':False,
              'anatomical_approval':False}
          print('L3_HOLDOUT_V47 '+json.dumps(out,ensure_ascii=False))
          PY
      - name: Always remove temporary CT segmentation and derived geometry
        if: always()
        run: rm -f "$RUNNER_TEMP/mask.nii.gz" "$RUNNER_TEMP/v24.obj" "$RUNNER_TEMP/v33.obj" "$RUNNER_TEMP/v35.obj" "$RUNNER_TEMP/private-v47.json"
