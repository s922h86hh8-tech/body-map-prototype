name: L3 LumASe single-mask label census (no imaging output)
on:
  push:
    branches: [cleanroom-pelvis-v0.1]
    paths: ['.github/workflows/l3-lumase-one-mask-metadata.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  label-census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install local-only mask readers
        run: python -m pip install --disable-pip-version-check requests remotezip numpy nibabel
      - name: Read one public L3 label mask through ZIP byte range and discard
        run: |
          python - <<'PY'
          import hashlib,requests,re,json,os,tempfile
          from collections import Counter
          from remotezip import RemoteZip
          import nibabel as nib
          import numpy as np
          record=requests.get('https://zenodo.org/api/records/7181338',timeout=30).json()
          info=next(f for f in record['files'] if f['key']=='L1-L5FineSegMix-663case.zip')
          url=info['links'].get('self') or info['links'].get('content')
          with RemoteZip(url) as z:
              members=[i for i in z.infolist() if re.search(r'_L3_seg\.nii\.gz$',i.filename,re.I) and not i.filename.startswith('__MACOSX/')]
              print('MATCHING_L3_MASKS',len(members))
              if len(members)<1:raise ValueError('No L3 masks in ZIP')
              selected=sorted(members,key=lambda f:(f.file_size,f.filename))[0]
              if selected.file_size>40_000_000:raise ValueError('L3 mask too large for range probe')
              data=z.read(selected)
          with tempfile.TemporaryDirectory() as folder:
              path=os.path.join(folder,'one_L3_seg.nii.gz')
              with open(path,'wb') as f:f.write(data)
              img=nib.load(path)
              mask=np.asarray(img.dataobj)
              unique,counts=np.unique(mask,return_counts=True)
              print('L3_MASK_METADATA',json.dumps({
                'member_sha256':hashlib.sha256(data).hexdigest(),
                'member_bytes':len(data),
                'shape':list(mask.shape),
                'voxel_spacing_mm':np.linalg.norm(img.affine[:3,:3],axis=0).round(4).tolist(),
                'labels_numeric_only_no_semantic_mapping':{str(int(a)):int(b) for a,b in zip(unique,counts)},
                'seven_anatomical_label_names_verified':False,
                'actual_labeled_L3_mask_read':True,
                'CT_image_file_read':False,
                'data_committed_to_repo':False,
                'no_anatomical_approval':True},ensure_ascii=False))
          PY
